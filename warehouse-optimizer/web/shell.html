<!DOCTYPE html>
<!--
  Emscripten shell for the Warehouse Optimizer.
  Hosts a full-page <canvas> and a collapsible console panel that mirrors
  the printed solver output ("ID, X, Y, Rotation").
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Warehouse Optimizer (WebGL)</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1c1f24; color: #d6dde6;
               font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  #canvas    { display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
  #canvas:active { cursor: grabbing; }
  #header    { position: fixed; top: 12px; left: 12px; padding: 6px 10px;
               background: rgba(20,22,26,0.7); border-radius: 6px; font-size: 13px;
               pointer-events: none; }
  #console   { position: fixed; bottom: 0; left: 0; right: 0; max-height: 35%;
               overflow: auto; background: rgba(15,17,20,0.92); color: #cfd8e3;
               font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
               padding: 8px 12px; border-top: 1px solid #2a2d33; }
  #consoleToggle {
               position: fixed; bottom: 8px; right: 12px; padding: 4px 10px;
               background: #2a2d33; color: #d6dde6; border: 1px solid #3a3e47;
               border-radius: 4px; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="header">Warehouse Optimizer · drag = orbit · right-drag = pan · scroll = zoom</div>
  <div id="console"></div>
  <button id="consoleToggle">Hide log</button>

<script>
  const consoleEl = document.getElementById('console');
  const toggle    = document.getElementById('consoleToggle');
  toggle.addEventListener('click', () => {
    if (consoleEl.style.display === 'none') {
      consoleEl.style.display = 'block'; toggle.textContent = 'Hide log';
    } else {
      consoleEl.style.display = 'none';  toggle.textContent = 'Show log';
    }
  });

  function appendLog(text, isErr) {
    const line = document.createElement('div');
    line.textContent = text;
    if (isErr) line.style.color = '#ff8b8b';
    consoleEl.appendChild(line);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  var Module = {
    canvas: (function () {
      const c = document.getElementById('canvas');
      // Default to a sensibly large drawable buffer.
      const dpr = window.devicePixelRatio || 1;
      const resize = () => {
        c.width  = Math.floor(c.clientWidth  * dpr);
        c.height = Math.floor(c.clientHeight * dpr);
      };
      resize();
      window.addEventListener('resize', resize);
      return c;
    })(),
    print:    function (t) { console.log(t); appendLog(t, false); },
    printErr: function (t) { console.warn(t); appendLog(t, true); },
    arguments: ['/data'],
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
